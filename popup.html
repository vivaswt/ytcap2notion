<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-top: 8px;
    }
    input {
      width: 100%;
      padding: 6px 8px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-top: 14px;
      background-color: #0f85f2;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #a0cff9;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
    }
    .error { color: #d93025; }
    .success { color: #188038; }
  </style>
</head>
<body>
  <h3>Save to Notion</h3>

  <label for="apiKey">Notion API Key</label>
  <input type="password" id="apiKey" placeholder="secret_..." />

  <label for="dbId">Database ID</label>
  <input type="text" id="dbId" placeholder="32-character ID" />

  <button id="saveBtn">Extract & Send</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
